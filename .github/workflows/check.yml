name: Numerical regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Strict native checks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -DTEST_ENGINE engine.cpp -o /tmp/engine-test
          /tmp/engine-test
      - name: Address and undefined behavior sanitizers
        run: |
          g++ -std=c++20 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -DTEST_ENGINE engine.cpp -o /tmp/engine-sanitized
          /tmp/engine-sanitized
